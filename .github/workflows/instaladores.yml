# Construye los instaladores de Antachawi Yachay (lenguaje + entorno) para
# Linux, Windows y macOS.
#
# * Al subir una etiqueta de versión (git tag v0.0.1 && git push origin
#   v0.0.1) se crea una "Release" en GitHub con los tres instaladores para
#   descargar.
# * También se puede lanzar a mano desde la pestaña Actions; en ese caso los
#   instaladores quedan como artefactos de la ejecución.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: linux
            maquina: ubuntu-22.04   # glibc antigua: funciona en más distros
          - sistema: windows
            maquina: windows-latest
          - sistema: macos
            maquina: macos-latest   # Apple Silicon (arm64)
    runs-on: ${{ matrix.maquina }}
    name: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install . PySide6-Essentials pyinstaller pillow pytest

      - name: Bibliotecas de Qt (Linux)
        if: matrix.sistema == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libfontconfig1 libdbus-1-3

      - name: Inno Setup (Windows)
        if: matrix.sistema == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_ide.py tests/test_api.py -q

      - name: Construir el instalador
        env:
          QT_QPA_PLATFORM: offscreen
        run: python empaquetado/construir.py

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.sistema }}
          path: dist/instaladores/*

  publicar:
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
